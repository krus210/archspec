service:
  name: example-service
  team: platform
  language: go
  repo: github.com/example/service
  domain: example
  ownership:
    primary: "@alice"
    oncall: "@oncall"
  responsibilities:
    - "expose REST API"
  invariants:
    - "all writes go through the outbox"
api:
  version: 1
  endpoints: []
  changelog: []
dependencies:
  upstream: []
  downstream:
    sync: []
    async: []
  storage: []
events:
  published: []
  consumed: []
consistency:
  model: eventual
  bounded_aggregate: example
  write_path:
    pattern: outbox
  read_path:
    consistency: eventual
  cross_service_invariants: []
concurrency:
  aggregates: []
  hot_keys: []
  shared_state: []
